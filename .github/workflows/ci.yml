
name: Secure CI Pipeline

on: [push]

permissions:
  contents: read

jobs:
  basic-check:
    name: Basic CI Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Check project files
        run: |
          test -s README.md
          test -s package.json
          test -s app.js
          test -s app.test.js
          echo "Required project files exist"

      - name: Run application tests
        run: npm test

      - name: Prepare dependency lockfile
        run: npm install --package-lock-only --ignore-scripts

      - name: Scan dependencies using npm audit
        run: npm audit --json > npm-audit-report.json

      - name: Install Semgrep
        run: python -m pip install semgrep

      - name: Scan source code using Semgrep
        run: semgrep scan --config auto --json --output semgrep-report.json .

      - name: Scan for exposed secrets using Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload security scan reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-reports
          path: |
            npm-audit-report.json
            semgrep-report.json
            package-lock.json
          if-no-files-found: warn
